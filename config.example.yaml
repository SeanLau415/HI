# ─────────────────────────────────────────────────────────────────────────────
# Monitoring System Config — annotated example
# Generated by config_builder.py  OR  edit manually.
# SFTP this file to /app/data/config.yaml on your VPS.
# Worker auto-detects file changes within 60s — no restart needed.
# ─────────────────────────────────────────────────────────────────────────────

global:
  # Default check interval (per-target/feed can override this)
  check_interval_minutes: 15

  # Send a "still alive" heartbeat every N hours
  heartbeat_interval_hours: 24

  # HTTP request timeout in seconds
  request_timeout: 30

  # Random delay range between retries (anti-ban jitter, in seconds)
  randomize_delay_min: 1.0
  randomize_delay_max: 4.0

  # ── Apprise notification URLs ──────────────────────────────────────────────
  # Full list of supported platforms: https://github.com/caronc/apprise/wiki
  # Tip: add multiple URLs to notify Telegram AND email simultaneously.
  apprise_urls:
    - "tgram://6123456789:ABCdef.../987654321"
    # Format: tgram://BOT_TOKEN/CHAT_ID
    # Get BOT_TOKEN from @BotFather, CHAT_ID from https://api.telegram.org/bot<TOKEN>/getUpdates

    # - "mailto://user:password@gmail.com?to=you@gmail.com"
    # For Gmail you need an App Password (not your login password)
    # https://myaccount.google.com/apppasswords

    # - "discord://webhook_id/webhook_token"
    # - "slack://TokenA/TokenB/TokenC/#channel"

# ─────────────────────────────────────────────────────────────────────────────
# TARGETS — Web page stock monitoring
#
# DETECTION MODES:
#
#   selector_disappears  →  "Out of Stock" badge/text vanishes = IN STOCK
#   selector_appears     →  "Order Now" / "Add to Cart" button appears = IN STOCK
#   content_hash         →  ANY visible text change fires alert (no selector needed)
#                           Best for: WHMCS stores, pages with dynamic stock counts
#
# HOW TO FIND CSS SELECTORS (Chrome):
#   1. Open the product page → right-click the "Out of Stock" text → Inspect
#   2. In DevTools → right-click the element → Copy → Copy selector
#   3. Paste into css_selector field
#
# ─────────────────────────────────────────────────────────────────────────────
targets:

  # ── RackNerd Black Friday 2025 ────────────────────────────────────────────
  # VERIFIED: page is WHMCS-based (my.racknerd.com).
  # WHMCS updates stock counts in real-time ("0 Available" appears when sold out).
  # BEST MODE: content_hash — catches any change: stock in/out, new locations,
  # "0 Available" appearing/disappearing, price changes, etc.
  - name: "RackNerd BF2025 Store"
    url: "https://my.racknerd.com/index.php?rp=/store/blackfriday2025"
    detection_mode: content_hash
    enabled: true
    check_interval_minutes: 10   # check every 10 min (hot deal page)

  # ── RackNerd — specific product page (1GB VPS) ────────────────────────────
  # When a WHMCS product page shows location options, the order button is:
  #   <a class="btn btn-primary btn-order-now" href="...">Order Now</a>
  # If ALL locations sell out, WHMCS may redirect or show an error page.
  # Use content_hash here too — safest for WHMCS.
  - name: "RackNerd 1GB KVM BF2025"
    url: "https://my.racknerd.com/index.php?rp=/store/blackfriday2025/1-gb-kvm-vps-black-friday-2025"
    detection_mode: content_hash
    enabled: true
    check_interval_minutes: 5

  # ── BandwagonHost — selector_appears example ──────────────────────────────
  # Their cart shows "Add to Cart" button when in stock; removes it when sold out.
  - name: "BandwagonHost CN2 GIA"
    url: "https://bandwagonhost.com/cart.php?a=confproduct&i=0"
    detection_mode: selector_appears
    css_selector: "input[value='Add to Cart']"
    enabled: false

  # ── Generic out-of-stock badge example ───────────────────────────────────
  # Use selector_disappears when the page has a permanent "Out of Stock" label.
  - name: "Example Store Product"
    url: "https://example-store.com/product/vps-512mb"
    detection_mode: selector_disappears
    css_selector: ".out-of-stock"
    # proxy: "socks5://user:pass@proxy.example.com:1080"
    enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# RSS FEEDS — New post / deal alerting with optional keyword filtering
#
# keywords: [] means ALL new items are forwarded (no filter).
# Keywords are case-insensitive and matched against title + summary.
# ─────────────────────────────────────────────────────────────────────────────
rss_feeds:

  # ── LowEndBox — no filter, get every post ────────────────────────────────
  - name: "LowEndBox"
    url: "https://lowendbox.com/feed/"
    keywords: []
    enabled: true
    check_interval_minutes: 30

  # ── LowEndTalk Offers — keyword filtered ─────────────────────────────────
  - name: "LowEndTalk Offers"
    url: "https://lowendtalk.com/categories/offers/feed.rss"
    keywords:
      - annual
      - yearly
      - lifetime
      - KVM
      - NVMe
      - "$"
    enabled: true
    check_interval_minutes: 20

  # ── ServaRICA ─────────────────────────────────────────────────────────────
  - name: "ServaRICA"
    url: "https://servarica.com/feed/"
    keywords:
      - annual
      - special
      - KVM
    enabled: true

  # ── RackNerd Blog ─────────────────────────────────────────────────────────
  - name: "RackNerd Blog"
    url: "https://blog.racknerd.com/feed/"
    keywords:
      - sale
      - special
      - black friday
      - flash
    enabled: true
